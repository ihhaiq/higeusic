services:
  worker:
    build: .
    environment:
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      BOT_TOKEN: ${BOT_TOKEN}
      OWNER_ID: ${OWNER_ID}
      LOG_GROUP_ID: ${LOG_GROUP_ID}
      MUSIC_BOT_NAME: ${MUSIC_BOT_NAME}
      MONGO_DB_URI: ${MONGO_DB_URI}
      JSON_DB_PATH: ${JSON_DB_PATH:-data/database.json}
      STRING_SESSION: ${STRING_SESSION}
      COOKIES: ${COOKIES}
      YOUTUBE_POT_ENABLED: ${YOUTUBE_POT_ENABLED:-true}
      YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-http://127.0.0.1:4416}
      YOUTUBE_EXTRACT_TIMEOUT: ${YOUTUBE_EXTRACT_TIMEOUT:-45}
      LONG_VIDEO_THRESHOLD_MIN: ${LONG_VIDEO_THRESHOLD_MIN:-30}
      LONG_VIDEO_MAX_QUALITY: ${LONG_VIDEO_MAX_QUALITY:-480}
      AUTO_LEAVING_ASSISTANT: ${AUTO_LEAVING_ASSISTANT:-False}
      START_IMG_URL: ${START_IMG_URL:-assets/Ping.jpeg}
